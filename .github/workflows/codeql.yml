name: codeql
on:
  push: { branches: [main] }
  schedule: [{ cron: "0 3 * * 1" }]
permissions: { contents: read, security-events: write }
jobs:
  analyze:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v3
        with: { languages: python }
      - uses: github/codeql-action/analyze@v3
